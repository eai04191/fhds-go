# fhds — Forza Horizon DualSense adaptive triggers
# Saving this file while fhds.exe is running hot-reloads the values.
# Forces are 0-255, frequencies in Hz.

# --- UDP ---
udp_host    = "127.0.0.1"
udp_port    = 5300
udp_timeout = 0.5

# --- Shared pedal config ---
pedal_value_max = 255
# Firmware wall depth: 1 = only zone 9 (lightest), 9 = whole travel walled.
wall_zones      = 2

# =============================================================
# L2 — Brake pedal
# =============================================================

# Resistance: rigid curve 0..wall_engage_at -> baseline..max_force, firmware
# wall at 100%.
enable_brake_resistance = true
brake_deadzone          = 50
brake_baseline_force    = 10
# Rigid force at brake_wall_engage_at (peak of the curve before the wall).
brake_max_force         = 60
# Parabolic: light through mid travel, sharply firm near the wall.
brake_curve             = 5.0
# Accel byte to switch to firmware wall.
brake_wall_engage_at    = 250
# Accel byte to release the wall back to rigid curve (hysteresis).
brake_wall_release_at   = 200

# Handbrake bonus: flat extra force when handbrake is engaged.
enable_handbrake_bonus = true
handbrake_bonus        = 25

# ABS pulse: vibrate when tire slip telemetry crosses thresholds under hard
# braking.
enable_abs                   = true
abs_brake_threshold          = 80
abs_min_speed_kmh            = 15.0
abs_slip_ratio_threshold     = 1.0
abs_combined_slip_threshold  = 1.0
abs_freq                     = 10
abs_amp                      = 20

# =============================================================
# R2 — Gas pedal
# =============================================================

# Resistance: light rigid curve 0..wall_engage_at -> baseline..max_force,
# firmware wall at 100%.
enable_throttle_resistance = true
accel_deadzone             = 50
throttle_baseline_force    = 0
# Rigid force at the wall threshold — much lighter than the brake.
throttle_max_force         = 8
# Parabolic: feather-light early, slightly firmer near the wall.
throttle_curve             = 5.0
throttle_wall_engage_at    = 250
throttle_wall_release_at   = 200

# Rev limiter: vibrate when rpm/max_rpm exceeds the ratio.
enable_rev_limiter = true
# Fire right at the cutoff, not across the whole upper rpm range.
rev_limit_ratio    = 0.93
rev_limit_freq     = 20
# Raw 0-255 byte for mode 0x06 vibration amplitude.
rev_limit_amp      = 1
# Hold buzz this long after each trigger so the rpm bounce doesn't stutter it.
rev_limit_hold_ms  = 120.0

# Gear shift: single short vibration burst on up/downshift while moving.
enable_gear_shift       = true
enable_gear_shift_brake = true
gear_shift_freq         = 20
gear_shift_amp          = 255
gear_shift_duration_ms  = 100.0

# =============================================================
# System
# =============================================================

# Startup pulse: brief trigger buzz to confirm HID connection on launch.
enable_startup_pulse = true
startup_pulse_force  = 150

# Auto-reconnect to the controller when it's missing or drops. Disabled by
# default for HidHide compatibility — re-enumerating HID devices while a
# HidHide cloak toggles can leave the OS holding a dead handle. Enable if you
# want USB unplug/replug to recover without restarting the app.
enable_reconnect      = false
reconnect_interval_s  = 5.0

# Auto-exit when game closes (Windows). Telemetry-lost is a fallback for Task
# Manager kills.
exit_on_game_close          = true
game_process_name_contains  = ["forza"]
game_poll_interval_s        = 1.0
telemetry_lost_exit_s       = 60.0
